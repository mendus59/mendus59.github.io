# Once a day, looks for public repos that have no card yet, adds a card for each to
# data/projects.json (see "New projects" in README.md), commits to main and redeploys the site.
name: Discover new projects

on:
  schedule:
    - cron: "47 8 * * *" # daily, 08:47 UTC (half an hour before the summary sync)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be added"
        type: boolean
        default: false

permissions:
  contents: write # commit data/projects.json and new icons
  actions: write # start the Pages deploy (pushes made with GITHUB_TOKEN don't trigger it)

concurrency:
  group: projects-json # shared with sync-summaries.yml; both write data/projects.json
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look for new public repos
        id: discover
        run: node scripts/discover-projects.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit and redeploy
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.discover.outputs.added }}
        run: |
          git add data/projects.json assets/icons
          if git diff --cached --quiet; then
            echo "No new projects."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add project cards for new repos: $ADDED"
          # If the admin panel published while this ran, replay on top of it rather than overwrite it.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
          gh workflow run pages.yml --ref main
